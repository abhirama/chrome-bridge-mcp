<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="chrome-bridge-mcp — drive your real, logged-in Chrome from any MCP client">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1E2B3A"/>
      <stop offset="1" stop-color="#0A1017"/>
    </linearGradient>
    <linearGradient id="span" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="0.55" stop-color="#12B886"/>
      <stop offset="1" stop-color="#0EA5A4"/>
    </linearGradient>
    <linearGradient id="ghost" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#0EA5A4" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="420" fill="url(#sky)"/>

  <!-- Oversized cable sweeping the full banner, echoing the mark. -->
  <path d="M-40 232 Q 640 470 1320 232" fill="none" stroke="url(#ghost)" stroke-width="26" stroke-linecap="round"/>
  <g stroke="#8FA3B8" stroke-opacity="0.07" stroke-width="3">
    <path d="M-40 330 H1320"/>
  </g>

  <!-- Mark -->
  <g transform="translate(96, 132) scale(1.22)">
    <rect width="128" height="128" rx="28" fill="#131C27"/>
    <rect x="1.5" y="1.5" width="125" height="125" rx="26.5" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="3"/>
    <path d="M33 45 Q 64 79 95 45" fill="none" stroke="url(#span)" stroke-width="10" stroke-linecap="round"/>
    <g stroke="#DCE6F0" stroke-opacity="0.7" stroke-width="9" stroke-linecap="round">
      <path d="M33 47 V88"/>
      <path d="M95 47 V88"/>
    </g>
    <path d="M20 92 H108" stroke="#F4F8FC" stroke-width="11" stroke-linecap="round"/>
    <circle cx="33" cy="42" r="12" fill="#34D399"/>
    <circle cx="95" cy="42" r="12" fill="#0EA5A4"/>
  </g>

  <!-- Wordmark -->
  <text x="300" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#F4F8FC" letter-spacing="-1.5">chrome-bridge-mcp</text>
  <text x="302" y="244" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" fill="#9FB3C8">Drive your real, already-logged-in Chrome from any MCP client.</text>

  <!-- Capability chips -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600">
    <g>
      <rect x="302" y="278" width="150" height="38" rx="19" fill="#10A37F" fill-opacity="0.16" stroke="#34D399" stroke-opacity="0.34"/>
      <text x="377" y="303" fill="#5EEAD4" text-anchor="middle">21 tools</text>
    </g>
    <g>
      <rect x="464" y="278" width="192" height="38" rx="19" fill="#10A37F" fill-opacity="0.10" stroke="#8FA3B8" stroke-opacity="0.24"/>
      <text x="560" y="303" fill="#C7D5E3" text-anchor="middle">real CDP, no relaunch</text>
    </g>
    <g>
      <rect x="668" y="278" width="176" height="38" rx="19" fill="#10A37F" fill-opacity="0.10" stroke="#8FA3B8" stroke-opacity="0.24"/>
      <text x="756" y="303" fill="#C7D5E3" text-anchor="middle">your real sessions</text>
    </g>
  </g>
</svg>
